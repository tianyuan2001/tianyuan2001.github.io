# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title                    : "Tianyuan Zhang"
description              : "I am a PhD student at State Key Laboratory of Software Development Environment at the Beihang University(BUAA)."
repository               : "tianyuan2001/tianyuan2001.github.io"
url: "https://tianyuan2001.github.io"
baseurl: ""
google_scholar_stats_use_cdn: false
scholar:
  enabled: true
  id: "w0mmwl4AAAAJ"
visitor_map:
  enabled: true
  provider: "flagcounter"
  # Use the URLs generated for your own Flag Counter; never a sample counter.
  flagcounter_image_url: "https://s05.flagcounter.com/map/DF5U/size_s/txt_526170/border_FFFFFF/pageviews_0/viewers_3/flags_0/"
  flagcounter_stats_url: "https://info.flagcounter.com/DF5U"
  # Paste the d= value from your ClustrMaps map_v2.js embed code.
  clustrmaps_id: ""

# google analytics
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# SEO Related
google_site_verification :  # get google_site_verification from https://search.google.com/search-console/about
bing_site_verification   :  # get bing_site_verification from https://www.bing.com/webmasters/about
baidu_site_verification  :  # get baidu_site_verification from https://ziyuan.baidu.com/login/index?u=/site/index

# Site Author
author:
  name             : "Tianyuan Zhang"
  avatar           : "images/zty_new.jpg"
  bio              : "Beihang University"
  location         : "Beijing, China"

  googlescholar    : "https://scholar.google.com/citations?user=w0mmwl4AAAAJ"
  email            : "zhangtianyuan@buaa.edu.cn"

  dblp             : "https://dblp.org/pid/145/6286-4.html"
  orcid            : "https://orcid.org/0000-0001-9874-6828"

include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - tests
  - Gemfile.lock
  - run_server.sh
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
