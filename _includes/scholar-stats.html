{% if site.scholar.enabled %}
<div class="scholar-stats" data-scholar-stats data-repository="{{ site.repository | escape }}" data-use-cdn="{{ site.google_scholar_stats_use_cdn }}">
  <a class="citation-badge" href="{{ site.author.googlescholar | escape }}" target="_blank" rel="noopener noreferrer"><i class="fas fa-graduation-cap" aria-hidden="true"></i> Total citations <strong data-scholar-total>—</strong></a>
  <small data-scholar-updated>Google Scholar</small>
</div>
{% endif %}
