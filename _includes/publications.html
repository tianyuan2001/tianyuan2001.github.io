{% assign selected_papers = site.data.publications | where_exp: "paper", "paper.selected_order != nil" | sort: "selected_order" %}
<div class="publication-browser" data-publication-tabs>
  <div class="publication-tabs" role="tablist" aria-label="Publication lists" hidden>
    <button type="button" role="tab" id="tab-selected" aria-controls="publications-selected" aria-selected="true" tabindex="0">Selected Publications <span class="publication-count">{{ selected_papers.size }}</span></button>
    <button type="button" role="tab" id="tab-full" aria-controls="publications-full" aria-selected="false" tabindex="-1">Full Publications <span class="publication-count">{{ site.data.publications.size }}</span></button>
  </div>
  <div id="publications-selected" role="tabpanel" aria-labelledby="tab-selected" tabindex="0" hidden>
    {% include publication-list.html papers=selected_papers %}
  </div>
  <div id="publications-full" role="tabpanel" aria-labelledby="tab-full" tabindex="0">
    {% include publication-list.html papers=site.data.publications %}
  </div>
</div>
